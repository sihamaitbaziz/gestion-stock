<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Stock Pro - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-boxes"></i>
                <h2>StockPro</h2>
            </div>
            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-page="dashboard">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
            <a href="#" class="nav-item" data-page="products">
                <i class="fas fa-box"></i>
                <span>Produits</span>
            </a>
            <a href="#" class="nav-item" data-page="history">
                <i class="fas fa-history"></i>
                <span>Historique</span>
            </a>
            <a href="#" class="nav-item" data-page="alerts">
                <i class="fas fa-bell"></i>
                <span>Alertes Stock</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
                <span>Mode Sombre</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1 id="pageTitle">Dashboard</h1>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Rechercher un produit...">
                </div>
                <button class="btn btn-primary" id="addProductBtn">
                    <i class="fas fa-plus"></i>
                    Nouveau Produit
                </button>
            </div>
        </header>

        <!-- Dashboard Page -->
        <div class="page active" id="dashboardPage">
            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon blue">
                        <i class="fas fa-box"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalProducts">0</h3>
                        <p>Total Produits</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon green">
                        <i class="fas fa-euro-sign"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalValue">0 €</h3>
                        <p>Valeur Totale</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon orange">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="lowStockCount">0</h3>
                        <p>Stock Faible</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon purple">
                        <i class="fas fa-layer-group"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="categoriesCount">0</h3>
                        <p>Catégories</p>
                    </div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-clock"></i> Activité Récente</h3>
                </div>
                <div class="card-body">
                    <div id="recentActivity" class="activity-list"></div>
                </div>
            </div>
        </div>

        <!-- Products Page -->
        <div class="page" id="productsPage">
            <div class="filters">
                <select id="categoryFilter" class="filter-select">
                    <option value="all">Toutes les catégories</option>
                    <option value="Électronique">Électronique</option>
                    <option value="Vêtements">Vêtements</option>
                    <option value="Alimentation">Alimentation</option>
                    <option value="Mobilier">Mobilier</option>
                    <option value="Autres">Autres</option>
                </select>
            </div>

            <div class="products-grid" id="productsGrid"></div>
        </div>

        <!-- History Page -->
        <div class="page" id="historyPage">
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Produit</th>
                                    <th>Action</th>
                                    <th>Quantité</th>
                                    <th>Utilisateur</th>
                                </tr>
                            </thead>
                            <tbody id="historyTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alerts Page -->
        <div class="page" id="alertsPage">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-bell"></i> Alertes Stock Faible</h3>
                </div>
                <div class="card-body">
                    <div id="alertsList" class="alerts-list"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Add/Edit Product -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Nouveau Produit</h3>
                <button class="modal-close" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="productForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="productName">Nom du produit *</label>
                        <input type="text" id="productName" required>
                    </div>

                    <div class="form-group">
                        <label for="productCategory">Catégorie *</label>
                        <select id="productCategory" required>
                            <option value="">Sélectionner...</option>
                            <option value="Électronique">Électronique</option>
                            <option value="Vêtements">Vêtements</option>
                            <option value="Alimentation">Alimentation</option>
                            <option value="Mobilier">Mobilier</option>
                            <option value="Autres">Autres</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="productQuantity">Quantité *</label>
                        <input type="number" id="productQuantity" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="productPrice">Prix (€) *</label>
                        <input type="number" id="productPrice" step="0.01" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="productMinStock">Stock Minimum</label>
                        <input type="number" id="productMinStock" min="0" value="10">
                    </div>

                    <div class="form-group">
                        <label for="productSupplier">Fournisseur</label>
                        <input type="text" id="productSupplier">
                    </div>

                    <div class="form-group full-width">
                        <label for="productImage">URL Image</label>
                        <input type="url" id="productImage" placeholder="https://...">
                    </div>

                    <div class="form-group full-width">
                        <label for="productDescription">Description</label>
                        <textarea id="productDescription" rows="3"></textarea>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Annuler</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>
</html>
